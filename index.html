      outlineWidth: 1,
      outlineColor: Cesium.Color.BLACK.withAlpha(0.4)
    }),
    clampToGround: true
  }
});

// ============ Stations, level crossings, singular points ============
DATA.stazioni.forEach(s => {
  const capolinea = s.tipo.includes('capolinea');
  viewer.entities.add({
    position: Cesium.Cartesian3.fromDegrees(s.lon, s.lat),
    point: {
      pixelSize: capolinea ? 14 : 9,
      color: Cesium.Color.fromCssColorString('#1f8a52'),
      outlineColor: Cesium.Color.WHITE,
      outlineWidth: 2,
      heightReference: Cesium.HeightReference.CLAMP_TO_GROUND
    },
    label: {
      text: s.nome,
      font: capolinea ? 'bold 14px sans-serif' : '12px sans-serif',
      fillColor: Cesium.Color.WHITE,
      outlineColor: Cesium.Color.BLACK,
      outlineWidth: 3,
      style: Cesium.LabelStyle.FILL_AND_OUTLINE,
      verticalOrigin: Cesium.VerticalOrigin.BOTTOM,
      pixelOffset: new Cesium.Cartesian2(0, -12),
      heightReference: Cesium.HeightReference.CLAMP_TO_GROUND,
      distanceDisplayCondition: new Cesium.DistanceDisplayCondition(0, 20000)
    }
  });
});

DATA.pl.forEach(p => {
  viewer.entities.add({
    position: Cesium.Cartesian3.fromDegrees(p.lon, p.lat),
    point: {
      pixelSize: 6,
      color: Cesium.Color.fromCssColorString('#c23b2f'),
      heightReference: Cesium.HeightReference.CLAMP_TO_GROUND
    }
  });
});

DATA.singolari.forEach(p => {
  viewer.entities.add({
    position: Cesium.Cartesian3.fromDegrees(p.lon, p.lat),
    point: {
      pixelSize: 8,
      color: Cesium.Color.fromCssColorString('#e0993a'),

    },
    label: {

      font: '11px sans-serif',
      fillColor: Cesium.Color.fromCssColorString('#f0b968'),
      outlineColor: Cesium.Color.BLACK,
      outlineWidth: 2,
      style: Cesium.LabelStyle.FILL_AND_OUTLINE,
      verticalOrigin: Cesium.VerticalOrigin.TOP,
      pixelOffset: new Cesium.Cartesian2(0, 10),
      heightReference: Cesium.HeightReference.CLAMP_TO_GROUND,
      distanceDisplayCondition: new Cesium.DistanceDisplayCondition(0, 8000)
    }
  });
});

// ============ cumulative distance along track (haversine) ============
function haversine(lon1, lat1, lon2, lat2) {
  const R = 6371000, toRad = d => d * Math.PI / 180;
  const dLat = toRad(lat2 - lat1), dLon = toRad(lon2 - lon1);
  const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon/2)**2;
  return 2 * R * Math.asin(Math.sqrt(a));
}
const track = DATA.track;
let cum = [0];
for (let i = 1; i < track.length; i++) {
  cum.push(cum[i-1] + haversine(track[i-1][0], track[i-1][1], track[i][0], track[i][1]));
}
const totalLenM = cum[cum.length - 1];
const totalKm = DATA.stazioni[DATA.stazioni.length - 1].km;

function pointAtKm(km) {
  const targetM = (km / totalKm) * totalLenM;
  let lo = 0, hi = cum.length - 1;
  if (targetM <= 0) return track[0];
  if (targetM >= totalLenM) return track[track.length - 1];
  while (lo < hi - 1) {
    const mid = (lo + hi) >> 1;
    if (cum[mid] < targetM) lo = mid; else hi = mid;
  }
  const segLen = cum[hi] - cum[lo];
  const t = segLen > 0 ? (targetM - cum[lo]) / segLen : 0;
  return [
    track[lo][0] + (track[hi][0] - track[lo][0]) * t,
    track[lo][1] + (track[hi][1] - track[lo][1]) * t
  ];
}

// ============ animated train entity ============
let currentKm = 0;
let direction = 1;
let speedKmh = 60;
const TIME_ACCEL = 90;

const trainEntity = viewer.entities.add({
  position: Cesium.Cartesian3.fromDegrees(track[0][0], track[0][1], 15),
  point: {
    pixelSize: 16,
    color: Cesium.Color.fromCssColorString('#e0993a'),
    outlineColor: Cesium.Color.WHITE,
    outlineWidth: 2,
    heightReference: Cesium.HeightReference.NONE,
    disableDepthTestDistance: Number.POSITIVE_INFINITY
  },
  label: {
    text: '🚆',
    font: '24px sans-serif',
    verticalOrigin: Cesium.VerticalOrigin.CENTER,
    horizontalOrigin: Cesium.HorizontalOrigin.CENTER,
    pixelOffset: new Cesium.Cartesian2(0, -2),
    disableDepthTestDistance: Number.POSITIVE_INFINITY
  }
});

const events = DATA.stazioni;
function updateNext() {
  let next;
  if (direction > 0) {
    next = events.find(e => e.km > currentKm + 0.0005) || events[events.length - 1];
  } else {
    next = [...events].reverse().find(e => e.km < currentKm - 0.0005) || events[0];
  }
  document.getElementById('nextVal').textContent =
    next.nome + ' (' + Math.abs(next.km - currentKm).toFixed(2).replace('.', ',') + ' km)';
}

let lastTime = null;
let following = false;

viewer.clock.onTick.addEventListener(() => {
  const now = performance.now();
  if (lastTime === null) { lastTime = now; return; }
  const dtH = (now - lastTime) / 1000 / 3600;
  lastTime = now;

  currentKm += speedKmh * dtH * TIME_ACCEL * direction;
  if (currentKm >= totalKm) { currentKm = totalKm; direction = -1; }
  else if (currentKm <= 0) { currentKm = 0; direction = 1; }

  const [lon, lat] = pointAtKm(currentKm);
  const pos = Cesium.Cartesian3.fromDegrees(lon, lat, 15);
  trainEntity.position = pos;

  document.getElementById('kmVal').textContent = currentKm.toFixed(3).replace('.', ',') + ' km';
  updateNext();

  if (following) {
    viewer.camera.lookAt(
      pos,
      new Cesium.HeadingPitchRange(0, Cesium.Math.toRadians(-30), 900)
    );
  }
});

// ============ controls ============
document.getElementById('speedSlider').addEventListener('input', e => {
  speedKmh = parseFloat(e.target.value);
  document.getElementById('speedLabel').textContent = speedKmh + ' km/h';
  document.getElementById('spVal').textContent = speedKmh + ' km/h';
});

document.getElementById('followBtn').addEventListener('click', () => {
  following = !following;
  document.getElementById('followBtn').textContent = following ? 'Vista libera' : 'Segui treno';
  if (!following) {
    viewer.camera.lookAtTransform(Cesium.Matrix4.IDENTITY);
  }
});

// ============ initial camera: fly to whole line ============
viewer.camera.flyTo({
  destination: Cesium.Cartesian3.fromDegrees(
    (Math.min(...track.map(p=>p[0])) + Math.max(...track.map(p=>p[0]))) / 2,
    (Math.min(...track.map(p=>p[1])) + Math.max(...track.map(p=>p[1]))) / 2,
    18000
  ),
  orientation: { pitch: Cesium.Math.toRadians(-55) }
});
</script>
